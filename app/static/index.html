<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タスク管理 | Markdoor TODO</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main>
    <h1>タスク管理</h1>
    <div class="messages" aria-live="polite"><p id="notice" role="status" hidden></p><p id="error" role="alert" hidden></p></div>
    <div class="workspace">
      <aside class="form-panel">
        <h2 id="form-heading">新しいタスク</h2>
        <form id="task-form">
          <label for="title">タイトル <span class="required" aria-hidden="true">必須</span></label>
          <input id="title" name="title" required autocomplete="off" aria-describedby="title-hint">
          <p id="title-hint" class="hint">前後の空白を除いて200文字まで</p>
          <label for="description">説明 <span class="optional" aria-hidden="true">任意</span></label>
          <textarea id="description" name="description" rows="5" aria-describedby="description-hint"></textarea>
          <p id="description-hint" class="hint">5,000文字まで</p>
          <button id="save" class="primary" type="submit">タスクを追加</button>
          <button id="cancel-edit" class="secondary" type="button" hidden>編集をキャンセル</button>
        </form>
      </aside>
      <section class="list-panel" aria-labelledby="list-heading">
        <div class="list-heading"><h2 id="list-heading">タスク一覧 <span id="total">0件</span></h2><button id="refresh" class="text-button" type="button">再読み込み</button></div>
        <div class="filters" role="group" aria-label="状態フィルタ">
          <button type="button" data-filter="" aria-pressed="true">全件</button>
          <button type="button" data-filter="false" aria-pressed="false">未完了</button>
          <button type="button" data-filter="true" aria-pressed="false">完了</button>
        </div>
        <div id="tasks" aria-busy="false"></div>
        <div id="empty" class="empty-state" hidden><h3>タスクはまだありません</h3></div>
        <nav class="pagination" aria-label="ページ切り替え"><button id="previous" type="button" class="secondary">前へ</button><span id="page-info">1 / 1 ページ</span><button id="next" type="button" class="secondary">次へ</button></nav>
      </section>
    </div>
  </main>
</body>
</html>
