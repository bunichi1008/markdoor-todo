[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "markdoor-todo"
version = "0.1.0"
description = "Markdoor interview task: a persistent TODO app"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.3",
  "sqlalchemy==2.0.40",
  "uvicorn==0.34.2",
]

[dependency-groups]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.6"]
browser = ["playwright==1.51.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: real Chromium UI tests (enable with --browser)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
